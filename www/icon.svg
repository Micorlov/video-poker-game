<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3A26"/>
      <stop offset="55%" stop-color="#0A2A1B"/>
      <stop offset="100%" stop-color="#04100C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#58E39B" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#16C172" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#16C172" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E4B8"/>
      <stop offset="50%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#D8AE47"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EDEFF6"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#vignette)"/>

  <!-- inner gold frame -->
  <rect x="40" y="40" width="944" height="944" rx="192" fill="none" stroke="url(#goldStroke)" stroke-width="16" opacity="0.85"/>

  <!-- fanned poker hand -->
  <g filter="url(#cardShadow)">

    <!-- LEFT card: King of Spades -->
    <g transform="translate(432,712) rotate(-22)">
      <g transform="translate(0,-430)">
        <rect x="-152" y="0" width="304" height="430" rx="34" fill="url(#cardFace)" stroke="#c7bfa4" stroke-width="5"/>
        <text x="-116" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#101322">K</text>
        <text x="-116" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#101322">&#9824;</text>
        <text x="0" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="190" fill="#101322" text-anchor="middle">&#9824;</text>
      </g>
    </g>

    <!-- RIGHT card: King of Hearts -->
    <g transform="translate(592,712) rotate(22)">
      <g transform="translate(0,-430)">
        <rect x="-152" y="0" width="304" height="430" rx="34" fill="url(#cardFace)" stroke="#c7bfa4" stroke-width="5"/>
        <text x="-116" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#E01B44">K</text>
        <text x="-116" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#E01B44">&#9829;</text>
        <text x="0" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="190" fill="#E01B44" text-anchor="middle">&#9829;</text>
      </g>
    </g>

    <!-- CENTER card: Ace of Spades (hero) -->
    <g transform="translate(512,690)">
      <g transform="translate(0,-460)">
        <rect x="-160" y="0" width="320" height="460" rx="36" fill="url(#cardFace)" stroke="#c7bfa4" stroke-width="6"/>
        <text x="-124" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="106" font-weight="700" fill="#101322">A</text>
        <text x="-124" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="#101322">&#9824;</text>
        <text x="0" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="232" fill="#101322" text-anchor="middle">&#9824;</text>
      </g>
    </g>

  </g>
</svg>
