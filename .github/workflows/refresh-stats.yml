name: Refresh Share Page Stats

# Runs every Monday at 09:00 UTC to pull fresh Play Console stats
# (rating, version) and redeploy the share page with updated numbers.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install canvas
        run: npm install canvas --no-save

      - name: Fetch Play Store stats
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetch-play-stats.js

      - name: Generate OG card image
        run: node scripts/generate-og-card.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: 'chore: weekly stats refresh [skip ci]'
