name: Daily comeback reminder

on:
  schedule:
    # 15:00 UTC daily — arbitrary fixed hour, adjust the cron below if a
    # different time is preferred. Deliberately not part of push-poll.yml;
    # see the comment atop scripts/push/dailyReminder.js for why this must
    # stay a once-a-day job.
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Same secret as push-poll.yml — must be added manually in GitHub repo
      # Settings -> Secrets and variables -> Actions, named
      # FIREBASE_SERVICE_ACCOUNT_KEY (full JSON key for a Firebase service
      # account with Firestore + Cloud Messaging access).
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "${{ runner.temp }}/firebase-service-account.json"

      - name: Run daily reminder
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/push/dailyReminder.js
