name: Broadcast push notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        required: true
      body:
        description: Notification body
        required: true
      platform:
        description: Platform filter (ios / android / web, blank = all)
        required: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "${{ runner.temp }}/firebase-service-account.json"

      - name: Send broadcast
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          BROADCAST_TITLE: ${{ inputs.title }}
          BROADCAST_BODY: ${{ inputs.body }}
          BROADCAST_PLATFORM: ${{ inputs.platform }}
        run: node scripts/push/broadcastAll.js
