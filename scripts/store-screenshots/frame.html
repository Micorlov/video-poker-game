<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Store-screenshot frame: renders one branded 9:16 marketing frame around a
     raw app capture. Driven by query params:
       ?img=<url>&kicker=&l1=&l2=&w=1080&h=1920&dir=rtl|ltr
     The layout is designed at 1080x1920 and scaled uniformly to w/h. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #06130c; overflow: hidden; }
  #canvas {
    position: relative; width: 1080px; height: 1920px;
    transform-origin: top left;
    background:
      radial-gradient(120% 60% at 50% -5%, #14382395 0%, transparent 60%),
      radial-gradient(140% 80% at 50% 115%, #0d2a1b88 0%, transparent 55%),
      #071710;
    overflow: hidden;
  }
  #kicker {
    position: absolute; top: 128px; left: 60px; right: 60px;
    text-align: center;
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 600; font-size: 34px; letter-spacing: 0.38em;
    color: #d9b45f; text-transform: uppercase;
  }
  #headline {
    position: absolute; top: 190px; left: 40px; right: 40px;
    text-align: center;
    font-family: 'Bricolage Grotesque', 'Instrument Sans', sans-serif;
    font-weight: 800; font-size: 92px; line-height: 1.06;
    letter-spacing: -0.01em;
  }
  #l1 { color: #f1e9d4; display: block; }
  #l2 { color: #43e08a; display: block; }
  #phone {
    position: absolute; top: 470px; left: 50%; transform: translateX(-50%);
    width: 744px; height: 1600px;
    border-radius: 64px;
    padding: 6px;
    background: linear-gradient(160deg, #e3c987 0%, #a8863e 45%, #d9b45f 100%);
    box-shadow: 0 -30px 90px rgba(0,0,0,0.55);
  }
  #bezel {
    width: 100%; height: 100%;
    background: #0b0f0c; border-radius: 58px; padding: 10px;
    box-sizing: border-box; overflow: hidden;
  }
  #shot {
    width: 100%; display: block; border-radius: 46px;
  }
</style>
</head>
<body>
<div id="canvas">
  <div id="kicker"></div>
  <div id="headline"><span id="l1"></span><span id="l2"></span></div>
  <div id="phone"><div id="bezel"><img id="shot"></div></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get('w') || '1080', 10);
  const h = parseInt(q.get('h') || '1920', 10);
  const scale = w / 1080;
  const canvas = document.getElementById('canvas');
  canvas.style.transform = 'scale(' + scale + ')';
  // Design height is 1920; if the target aspect is taller, stretch the design
  // height so the phone still bleeds off the bottom edge.
  canvas.style.height = Math.round(h / scale) + 'px';
  document.getElementById('kicker').textContent = q.get('kicker') || '';
  document.getElementById('l1').textContent = q.get('l1') || '';
  document.getElementById('l2').textContent = q.get('l2') || '';
  if (q.get('dir') === 'rtl') {
    document.getElementById('headline').dir = 'rtl';
    // Letter-spacing disconnects joined Arabic script — drop it for RTL.
    document.getElementById('kicker').style.letterSpacing = '0';
  }
  const img = document.getElementById('shot');
  img.src = q.get('img') || '';
  // Signals run.js polls before taking the screenshot.
  window.frameReady = false;
  Promise.all([
    document.fonts.ready,
    new Promise(res => { img.complete ? res() : (img.onload = res, img.onerror = res); })
  ]).then(() => { window.frameReady = true; });
</script>
</body>
</html>
